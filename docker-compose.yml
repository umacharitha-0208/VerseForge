# Not usable yet on this machine -- Docker Desktop isn't installed here (would need
# admin rights + WSL2/Hyper-V + a reboot). Kept for when you do have Docker available;
# until then, run backend/frontend/n8n natively via the run_*.bat scripts.
#
# NOTE: the backend image is CPU-only (see backend/Dockerfile) -- Demucs/Whisper will be
# much slower than the native GPU-accelerated run on this machine.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
    env_file:
      - .env

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_USER_MANAGEMENT_DISABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_inbox:/inbox
    depends_on:
      - backend

volumes:
  n8n_data:
