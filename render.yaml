services:
  - type: web
    name: verseforge-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/status
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMUCS_MODEL
        value: htdemucs
      - key: WHISPER_MODEL_SIZE
        value: base
      - key: REFINE_MAX_ITERATIONS
        value: "3"